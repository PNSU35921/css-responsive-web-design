
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse by Job Categories</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="categories-section">
    <h1 class="section-title">
      Browse by<br>
      <span>Job</span> Categories
    </h1>

    <div class="categories-grid">

      <article class="category-card">
        <div class="category-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 10v4h4l9 5V5l-9 5H3z"/>
            <path d="M7 15l2 5h3l-2-5M19 8c2 2 2 6 0 8" fill="none" stroke="currentColor" stroke-width="2"/>
          </svg>
        </div>
        <div class="card-bottom">
          <div>
            <h2>Digital Marketing</h2>
            <p>143 Jobs Opened</p>
          </div>
          <span class="arrow">➜</span>
        </div>
      </article>

      <article class="category-card">
        <div class="category-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m4 20 5-1 11-11-4-4L5 15l-1 5zM14 6l4 4M8 16l2 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="card-bottom">
          <div>
            <h2>Art &amp; Design</h2>
            <p>110 Jobs Opened</p>
          </div>
          <span class="arrow">➜</span>
        </div>
      </article>

      <article class="category-card accounting">
        <div class="category-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2v20M17 6c-2-2-10-2-10 3 0 5 10 2 10 7 0 5-8 5-10 2" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="card-bottom">
          <div>
            <h2>Accounting</h2>
            <p>158 Jobs Opened</p>
          </div>
          <span class="arrow">➜</span>
        </div>
      </article>

      <article class="category-card">
        <div class="category-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="6" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
            <circle cx="12" cy="13" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M8 6l1-3h6l1 3" fill="none" stroke="currentColor" stroke-width="2"/>
          </svg>
        </div>
        <div class="card-bottom">
          <div>
            <h2>Photography</h2>
            <p>95 Jobs Opened</p>
          </div>
          <span class="arrow">➜</span>
        </div>
      </article>

      <article class="category-card">
        <div class="category-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="4" y="4" width="15" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="m10 14 8-8 2 2-8 8-4 1 1-4" fill="none" stroke="currentColor" stroke-width="2"/>
          </svg>
        </div>
        <div class="card-bottom">
          <div>
            <h2>Copy Writing</h2>
            <p>113 Jobs Opened</p>
          </div>
          <span class="arrow">➜</span>
        </div>
      </article>

      <article class="category-card">
        <div class="category-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 14v-3a8 8 0 0 1 16 0v3M4 13h4v7H6a2 2 0 0 1-2-2v-5zM16 13h4v5a2 2 0 0 1-2 2h-2v-7z" fill="none" stroke="currentColor" stroke-width="2"/>
          </svg>
        </div>
        <div class="card-bottom">
          <div>
            <h2>Music</h2>
            <p>55 Jobs Opened</p>
          </div>
          <span class="arrow">➜</span>
        </div>
      </article>

      <article class="category-card">
        <div class="category-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="8" cy="7" r="3"/>
            <circle cx="17" cy="9" r="2.5"/>
            <path d="M3 21v-5a5 5 0 0 1 10 0v5M14 21v-5a4 4 0 0 1 7 0v5" fill="none" stroke="currentColor" stroke-width="2"/>
          </svg>
        </div>
        <div class="card-bottom">
          <div>
            <h2>Human Resources</h2>
            <p>25 Jobs Opened</p>
          </div>
          <span class="arrow">➜</span>
        </div>
      </article>

      <article class="category-card explore-card">
        <div class="explore-pattern"></div>
        <div class="explore-content">
          <h2>Explore<br>30 More<br>Categories</h2>
          <span class="explore-arrow">➜</span>
        </div>
      </article>

    </div>
  </main>

</body>
</html>
